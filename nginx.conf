server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Home: serve file directly so nginx never internally redirects / → /index.html
    # (that redirect + "return 301 /" caused an infinite loop and broke healthcheck).
    location = / {
        try_files /index.html =404;
    }

    # Canonical: only visitors who type /index.html (not the internal index lookup)
    location = /index.html {
        return 301 /$is_args$args;
    }
    location = /cotacao.html { return 301 /calcular-frete/; }
    location = /rastreamento.html { return 301 /rastreamento/; }
    location = /cadastro-seller.html { return 301 https://app.freteq.com.br/cadastro; }

    location = /robots.txt { add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=86400"; }

    location /assets/css/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(ico|png|jpg|jpeg|webp|avif|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
